<svg width="900" height="280" viewBox="0 0 900 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="x" x1="80" y1="40" x2="820" y2="240">
      <stop stop-color="#25D366"/>
      <stop offset="0.4" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="280" fill="transparent"/>

  <g filter="url(#glow)">
    <rect x="120" y="80" width="150" height="100" rx="18" fill="#111827" stroke="#25D366" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3s" repeatCount="indefinite"/>
    </rect>

    <rect x="375" y="60" width="150" height="130" rx="18" fill="#111827" stroke="#3B82F6" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="4s" repeatCount="indefinite"/>
    </rect>

    <rect x="630" y="80" width="150" height="100" rx="18" fill="#111827" stroke="#F59E0B" stroke-width="3">
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <path d="M270 130 H375" stroke="url(#x)" stroke-width="4" stroke-dasharray="12 10">
      <animate attributeName="stroke-dashoffset" values="0;44" dur="2s" repeatCount="indefinite"/>
    </path>

    <path d="M525 130 H630" stroke="url(#x)" stroke-width="4" stroke-dasharray="12 10">
      <animate attributeName="stroke-dashoffset" values="44;0" dur="2s" repeatCount="indefinite"/>
    </path>

    <circle cx="195" cy="130" r="18" fill="#25D366"/>
    <circle cx="450" cy="125" r="20" fill="#3B82F6"/>
    <circle cx="705" cy="130" r="18" fill="#F59E0B"/>
  </g>
</svg>