<svg width="590" height="360" viewBox="0 0 700 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="80" y1="40" x2="620" y2="330">
      <stop stop-color="#FF6EC7"/>
      <stop offset="0.25" stop-color="#FFA43D"/>
      <stop offset="0.5" stop-color="#FFD93D"/>
      <stop offset="0.75" stop-color="#3DDAD7"/>
      <stop offset="1" stop-color="#8C6BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6EC7" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FFA43D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="700" height="360" fill="transparent"/>

  <ellipse cx="350" cy="180" rx="210" ry="115" fill="url(#glow)" opacity="0.55">
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <g transform="translate(350 180)" filter="url(#soft)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="13s" repeatCount="indefinite"/>
      <ellipse rx="210" ry="62" stroke="url(#g)" stroke-width="3" opacity="0.7"/>
      <ellipse rx="160" ry="48" stroke="url(#g)" stroke-width="2" opacity="0.45" transform="rotate(60)"/>
      <ellipse rx="160" ry="48" stroke="url(#g)" stroke-width="2" opacity="0.45" transform="rotate(120)"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
      <circle r="70" stroke="url(#g)" stroke-width="3" stroke-dasharray="15 12" opacity="0.8"/>
      <circle cx="70" cy="0" r="8" fill="#FF6EC7"/>
      <circle cx="-70" cy="0" r="8" fill="#FFA43D"/>
      <circle cx="0" cy="70" r="8" fill="#FFD93D"/>
      <circle cx="0" cy="-70" r="8" fill="#8C6BFA"/>
    </g>

    <g>
      <polygon points="0,-55 50,-25 50,35 0,65 -50,35 -50,-25" fill="#1B1035" stroke="url(#g)" stroke-width="4"/>
      <polygon points="0,-55 50,-25 0,5 -50,-25" fill="#2A1854" opacity="0.9"/>
      <polygon points="50,-25 50,35 0,65 0,5" fill="#150C29" opacity="0.9"/>
      <polygon points="-50,-25 0,5 0,65 -50,35" fill="#0D0619" opacity="0.9"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" repeatCount="indefinite"/>
    </g>

    <circle r="16" fill="#FF6EC7">
      <animate attributeName="r" values="12;20;12" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g fill="#FFD93D">
    <path d="M0,-11 L2.6,-2.6 L11,0 L2.6,2.6 L0,11 L-2.6,2.6 L-11,0 L-2.6,-2.6 Z" transform="translate(110 75)">
      <animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2 Z" fill="#FF6EC7" transform="translate(615 95)">
      <animate attributeName="opacity" values="0;1;0" dur="3.1s" begin="0.8s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-9 L2.2,-2.2 L9,0 L2.2,2.2 L0,9 L-2.2,2.2 L-9,0 L-2.2,-2.2 Z" fill="#3DDAD7" transform="translate(95 285)">
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8 Z" fill="#8C6BFA" transform="translate(605 275)">
      <animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="0.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
