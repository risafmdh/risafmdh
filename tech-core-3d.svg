<svg width="700" height="360" viewBox="0 0 700 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="80" y1="40" x2="620" y2="330">
      <stop stop-color="#25D366"/>
      <stop offset="0.35" stop-color="#3B82F6"/>
      <stop offset="0.7" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="700" height="360" fill="transparent"/>

  <ellipse cx="350" cy="180" rx="210" ry="115" fill="url(#glow)" opacity="0.55">
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <g transform="translate(350 180)" filter="url(#soft)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      <ellipse rx="210" ry="62" stroke="url(#g)" stroke-width="3" opacity="0.7"/>
      <ellipse rx="160" ry="48" stroke="url(#g)" stroke-width="2" opacity="0.45" transform="rotate(60)"/>
      <ellipse rx="160" ry="48" stroke="url(#g)" stroke-width="2" opacity="0.45" transform="rotate(120)"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
      <circle r="70" stroke="url(#g)" stroke-width="3" stroke-dasharray="15 12" opacity="0.8"/>
      <circle cx="70" cy="0" r="8" fill="#25D366"/>
      <circle cx="-70" cy="0" r="8" fill="#3B82F6"/>
      <circle cx="0" cy="70" r="8" fill="#F59E0B"/>
      <circle cx="0" cy="-70" r="8" fill="#A855F7"/>
    </g>

    <g>
      <polygon points="0,-55 50,-25 50,35 0,65 -50,35 -50,-25" fill="#111827" stroke="url(#g)" stroke-width="4"/>
      <polygon points="0,-55 50,-25 0,5 -50,-25" fill="#1F2937" opacity="0.9"/>
      <polygon points="50,-25 50,35 0,65 0,5" fill="#0F172A" opacity="0.9"/>
      <polygon points="-50,-25 0,5 0,65 -50,35" fill="#020617" opacity="0.9"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.08;1" dur="3s" repeatCount="indefinite"/>
    </g>

    <circle r="16" fill="#25D366">
      <animate attributeName="r" values="12;20;12" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>